<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<title>Ойыншы картасы — Жақсылықов</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800;900&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: {{t.behind}}; color: {{t.ink}}; font-family: Nunito, system-ui, sans-serif; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: repeating-linear-gradient(180deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 46px, transparent 46px, transparent 92px)"></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: {{t.scrim}}"></div>

  <section role="dialog" aria-label="Ойыншы картасы: Ерасыл Жақсылықов" style="position: absolute; left: 0; right: 0; top: 64px; bottom: 0; background: {{t.card}}; border-radius: 28px 28px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.22); display: flex; flex-direction: column">

    <div style="position: relative; height: 48px; flex-shrink: 0">
      <span aria-hidden="true" style="position: absolute; left: 50%; top: 10px; width: 40px; height: 5px; margin-left: -20px; border-radius: 3px; background: {{t.line}}"></span>
      <button aria-label="Жабу" style="position: absolute; right: 14px; top: 8px; width: 44px; height: 44px; border-radius: 15px; border: 0; background: {{t.card2}}; box-shadow: inset 0 -2px 0 {{t.tileLip}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6 L18 18 M18 6 L6 18" fill="none" stroke="{{t.ink}}" style="stroke-width: 2.6; stroke-linecap: round"></path></svg>
      </button>
    </div>

    <div style="position: relative; overflow: hidden; margin: 8px 16px 0; height: 150px; flex-shrink: 0; border-radius: 22px; background: linear-gradient(135deg, #1F7A4C 0%, #0F4A2D 100%); box-shadow: 0 4px 0 #0B3A23; display: flex; align-items: flex-end; gap: 14px; padding: 0 16px">
      <img src="/_blob/6ab22260e6619c09cae57216a13de6a2" alt="" style="position: absolute; right: -34px; top: -26px; width: 170px; height: 170px; object-fit: contain; opacity: 0.16">
      <div style="position: relative; width: 104px; height: 128px; flex-shrink: 0; box-sizing: border-box; border-radius: 18px 18px 0 0; border: 2px dashed rgba(255,255,255,0.5); border-bottom: 0; background: rgba(255,255,255,0.1); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
        <svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="4" fill="none" stroke="#FFFFFF" style="stroke-width: 1.6"></circle><path d="M4 21 C4 16.5 7.6 14 12 14 C16.4 14 20 16.5 20 21" fill="none" stroke="#FFFFFF" style="stroke-width: 1.6; stroke-linecap: round"></path></svg>
        <span style="font-size: 11px; font-weight: 800; color: #FFFFFF">Фото</span>
      </div>
      <div style="position: relative; flex: 1; min-width: 0; padding-bottom: 16px; display: flex; flex-direction: column; gap: 5px; color: #FFFFFF">
        <span style="font-size: 13px; font-weight: 700; color: #D7EBDD">Ерасыл</span>
        <span style="font-family: Rubik, system-ui, sans-serif; font-weight: 800; font-size: 23px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Жақсылықов</span>
        <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800">
          <img src="/_blob/6ab22260e6619c09cae57216a13de6a2" alt="" style="width: 18px; height: 18px; object-fit: contain">
          <span>Елімай · Қорғаушы</span>
        </span>
        <span style="display: flex; align-items: center; gap: 8px; margin-top: 2px">
          <span style="background: #FFFFFF; color: #0F1C26; font-family: Rubik, system-ui, sans-serif; font-weight: 800; font-size: 13px; padding: 3px 10px; border-radius: 999px; box-shadow: 0 2px 0 rgba(0,0,0,0.25)">6.0 млн</span>
          <span style="font-size: 12px; font-weight: 700; color: #D7EBDD">24% таңдаған</span>
        </span>
      </div>
    </div>

    <div style="margin: 14px 16px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="6">
        <div style="background: {{t.card2}}; border-radius: 16px; padding: 9px 12px 10px; display: flex; flex-direction: column; gap: 4px; box-shadow: inset 0 -2px 0 {{t.tileLip}}">
          <span style="font-size: 11px; font-weight: 700; color: {{t.muted}}; white-space: nowrap">{{s.label}}</span>
          <span style="font-family: Rubik, system-ui, sans-serif; font-size: 20px; font-weight: 800; line-height: 1">{{s.value}}</span>
        </div>
      </sc-for>
    </div>

    <div style="margin: 16px 16px 0; display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-family: Rubik, system-ui, sans-serif; font-weight: 700; font-size: 15px">Соңғы 5 тур</h2>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{lastTours}}" as="g" hint-placeholder-count="5">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
            <span style="width: 100%; height: 36px; border-radius: 12px; background: {{t.soft}}; box-shadow: 0 2px 0 {{t.softLip}}; color: {{t.primaryText}}; font-family: Rubik, system-ui, sans-serif; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center">{{g.pts}}</span>
            <span style="font-size: 10px; font-weight: 700; color: {{t.muted}}">{{g.label}}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="margin: 16px 16px 0; display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0 0 2px; font-family: Rubik, system-ui, sans-serif; font-weight: 700; font-size: 15px">Келесі матчтар</h2>
      <sc-for list="{{fixtures}}" as="f" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 12px; border-radius: 14px; background: {{t.card2}}">
          <span style="width: 44px; font-size: 11px; font-weight: 800; color: {{t.muted}}">{{f.tour}}</span>
          <img src="{{f.logo}}" alt="" style="width: 24px; height: 24px; object-fit: contain">
          <span style="flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 6px">
            <span style="font-size: 14px; font-weight: 800">{{f.club}}</span>
            <span style="font-size: 11px; font-weight: 700; color: {{t.muted}}">{{f.venue}}</span>
          </span>
          <span style="background: {{f.bg}}; color: {{f.fg}}; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 999px">{{f.level}}</span>
        </div>
      </sc-for>
    </div>

    <div style="margin: 16px 16px 16px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <button style="height: 52px; border-radius: 17px; border: 0; background: {{t.gold}}; box-shadow: 0 4px 0 {{t.goldLip}}, inset 0 1px 0 rgba(255,255,255,0.4); color: {{t.onGold}}; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
          <span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 10px; background: {{t.onGold}}; color: {{t.gold}}; font-family: Rubik, system-ui, sans-serif; font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center">К</span>
          <span style="font-family: Rubik, system-ui, sans-serif; font-weight: 800; font-size: 15px">Капитан ету</span>
        </button>
        <button style="height: 52px; border-radius: 17px; border: 0; background: {{t.soft}}; box-shadow: 0 4px 0 {{t.softLip}}; color: {{t.primaryText}}; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
          <span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 10px; background: {{t.primaryText}}; color: {{t.soft}}; font-family: Rubik, system-ui, sans-serif; font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center">В</span>
          <span style="font-family: Rubik, system-ui, sans-serif; font-weight: 800; font-size: 15px">Вице-капитан</span>
        </button>
      </div>
      <button style="height: 44px; border-radius: 14px; border: 0; background: transparent; color: {{t.primaryText}}; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7 H20 M16 3 L20 7 L16 11 M20 17 H4 M8 13 L4 17 L8 21" fill="none" stroke="{{t.primaryText}}" style="stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"></path></svg>
        <span style="font-family: Rubik, system-ui, sans-serif; font-weight: 700; font-size: 14px">Трансферге шығару</span>
      </button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const t = dark ? {
      behind: '#1A5532', scrim: 'rgba(5,10,15,0.62)',
      card: '#18232E', card2: '#213040', ink: '#EEF3F7', muted: '#93A4B2', line: '#34465A',
      soft: '#1C3446', softLip: '#122535', primaryText: '#8ED0F2', tileLip: 'rgba(0,0,0,0.25)',
      gold: '#F2C14E', goldLip: '#B98A1C', onGold: '#3D2A00',
      easy: ['#1C3446', '#8ED0F2'], mid: ['#3A2F17', '#F2C97A'], hard: ['#3E2219', '#F3A07E']
    } : {
      behind: '#3A9A57', scrim: 'rgba(10,20,28,0.45)',
      card: '#FFFFFF', card2: '#F2F7FB', ink: '#0F1C26', muted: '#5B6B78', line: '#D5E0E8',
      soft: '#DDEFF8', softLip: '#BCDDEE', primaryText: '#08608E', tileLip: '#DCE7EF',
      gold: '#F5BF2E', goldLip: '#C48A08', onGold: '#3D2A00',
      easy: ['#DDEFF8', '#08608E'], mid: ['#FDEFD2', '#7A4A00'], hard: ['#FBDCCB', '#8A2E0B']
    };
    const stats = [
      { label: 'Ұпай', value: '64' },
      { label: 'Гол', value: '2' },
      { label: 'Ассист', value: '3' },
      { label: 'Құрғақ ойын', value: '5' },
      { label: 'Минут', value: '1 020' },
      { label: 'Сары карта', value: '1' }
    ];
    const lastTours = [
      { label: '8-тур', pts: '6' },
      { label: '9-тур', pts: '2' },
      { label: '10-тур', pts: '9' },
      { label: '11-тур', pts: '1' },
      { label: '12-тур', pts: '8' }
    ];
    // Қарсыластың қиындығы: мәтінмен де жазылады, тек түске сүйенбейді
    const levels = {
      easy: { text: 'Жеңіл', c: t.easy },
      mid: { text: 'Орташа', c: t.mid },
      hard: { text: 'Қиын', c: t.hard }
    };
    const fixture = (tour, club, logo, venue, level) => ({
      tour: tour, club: club, logo: logo, venue: venue,
      level: levels[level].text, bg: levels[level].c[0], fg: levels[level].c[1]
    });
    const fixtures = [
      fixture('13-тур', 'Тобыл', '/_blob/1231d7be11eb046011d15dd9543a58b8', 'үйде', 'mid'),
      fixture('14-тур', 'Қайрат', '/_blob/a8859c111a874082c57ecaec6a6860ee', 'қонақта', 'hard'),
      fixture('15-тур', 'Қайсар', '/_blob/b4cb3317c5cff4a49aa7b3f43db372f4', 'үйде', 'easy')
    ];
    return { t: t, stats: stats, lastTours: lastTours, fixtures: fixtures };
  }
}
</script>
</body>
</html>
