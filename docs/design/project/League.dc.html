<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<title>Мини-лига — Офис лигасы</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800;900&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; font-family: Nunito, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 12px; padding: 12px 16px 6px">
    <button aria-label="Артқа" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 15px; border: 0; background: {{t.card}}; box-shadow: {{t.buttonShadow}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 L8 12 L15 19" fill="none" stroke="{{t.ink}}" style="stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"></path></svg>
    </button>
    <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
      <h1 style="margin: 0; font-family: Rubik, system-ui, sans-serif; font-weight: 800; font-size: 22px; line-height: 1">Офис лигасы</h1>
      <span style="font-size: 12px; font-weight: 700; color: {{t.muted}}">12 қатысушы · жеке лига</span>
    </div>
  </header>

  <section style="position: relative; overflow: hidden; margin: 8px 16px 0; background: {{t.card}}; border-radius: 24px; padding: 14px; display: flex; flex-direction: column; gap: 12px; box-shadow: {{t.cardShadow}}">
    <svg width="150" height="150" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; right: -40px; top: -48px; opacity: {{t.watermarkOp}}"><circle cx="12" cy="12" r="9" fill="none" stroke="{{t.primaryText}}" style="stroke-width: 1"></circle><path d="{{shanyrakD}}" fill="none" stroke="{{t.primaryText}}" style="stroke-width: 0.9; stroke-linecap: round"></path></svg>
    <div style="position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-family: Rubik, system-ui, sans-serif; font-weight: 700; font-size: 17px; line-height: 1.1">Достарыңды шақыр</span>
        <span style="display: flex; align-items: baseline; gap: 8px">
          <span style="font-size: 12px; font-weight: 700; color: {{t.muted}}">Лига коды</span>
          <span style="font-family: Rubik, system-ui, sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 0.12em; color: {{t.primaryText}}">QPL-7K2M</span>
        </span>
      </div>
      <button aria-label="Кодты көшіру" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 15px; border: 0; background: {{t.card2}}; box-shadow: inset 0 -2px 0 {{t.tileLip}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 9 H19 V19 H9 Z M15 9 V5 H5 V15 H9" fill="none" stroke="{{t.ink}}" style="stroke-width: 2.2; stroke-linejoin: round"></path></svg>
      </button>
    </div>
    <button style="position: relative; height: 48px; border-radius: 16px; border: 0; background: {{t.chipBg}}; box-shadow: 0 4px 0 {{t.lip}}, inset 0 1px 0 rgba(255,255,255,0.25); color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3 L10 14 M21 3 L14.5 21 L10 14 L3 9.5 Z" fill="none" stroke="#FFFFFF" style="stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"></path></svg>
      <span style="font-family: Rubik, system-ui, sans-serif; font-weight: 800; font-size: 15px">Telegram-да бөлісу</span>
    </button>
  </section>

  <div style="display: flex; gap: 4px; margin: 12px 16px 0; padding: 4px; border-radius: 18px; background: {{t.card2}}; box-shadow: inset 0 2px 0 {{t.tileLip}}">
    <button aria-pressed="true" style="flex: 1; height: 44px; border-radius: 14px; border: 0; background: {{t.card}}; box-shadow: {{t.buttonShadow}}; color: {{t.ink}}; font-family: Rubik, system-ui, sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">Жалпы</button>
    <button aria-pressed="false" style="flex: 1; height: 44px; border-radius: 14px; border: 0; background: transparent; color: {{t.muted}}; font-family: Rubik, system-ui, sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">12-тур</button>
  </div>

  <section style="flex: 1; min-height: 0; overflow: hidden; margin: 12px 16px 0; background: {{t.card}}; border-radius: 22px; padding: 6px; box-shadow: {{t.cardShadow}}">
    <div style="display: grid; grid-template-columns: 46px minmax(0, 1fr) 40px 52px; align-items: center; gap: 6px; padding: 6px 10px 8px; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: {{t.muted}}">
      <span>#</span>
      <span>Команда</span>
      <span style="text-align: right">Тур</span>
      <span style="text-align: right">Жалпы</span>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
      <div style="display: grid; grid-template-columns: 46px minmax(0, 1fr) 40px 52px; align-items: center; gap: 6px; height: 50px; padding: 0 10px; border-radius: 14px; background: {{r.bg}}; box-shadow: {{r.ring}}">
        <span style="display: flex; align-items: center; gap: 6px">
          <span style="font-family: Rubik, system-ui, sans-serif; font-weight: 800; font-size: 15px; min-width: 14px">{{r.rank}}</span>
          <svg width="10" height="10" viewBox="0 0 10 10" role="img" aria-label="{{r.moveLabel}}"><path d="{{r.moveD}}" fill="{{r.moveColor}}"></path></svg>
        </span>
        <span style="min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 14px; font-weight: 800; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.team}}</span>
          <span style="font-size: 11px; font-weight: 700; color: {{r.managerColor}}; line-height: 1.2">{{r.manager}}</span>
        </span>
        <span style="text-align: right; font-family: Rubik, system-ui, sans-serif; font-weight: 600; font-size: 14px">{{r.gw}}</span>
        <span style="text-align: right; font-family: Rubik, system-ui, sans-serif; font-weight: 800; font-size: 15px">{{r.total}}</span>
      </div>
    </sc-for>
  </section>

  <nav style="display: flex; margin: 14px 16px 12px; padding: 6px; background: {{t.card}}; border-radius: 24px; box-shadow: {{t.navShadow}}">
    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="4">
      <a href="#" aria-current="{{tab.current}}" style="flex: 1; height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{tab.color}}; font-size: 11px; font-weight: 800; border-radius: 18px">
        <span style="width: 46px; height: 28px; border-radius: 14px; background: {{tab.pill}}; box-shadow: {{tab.lip}}; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="{{tab.icon}}" fill="none" stroke="{{tab.iconColor}}" style="stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round"></path></svg>
        </span>
        <span>{{tab.label}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const t = dark ? {
      bg: '#0E1621', card: '#18232E', card2: '#213040', ink: '#EEF3F7', muted: '#93A4B2', line: '#263546',
      chipBg: '#176C99', lip: '#0F4E70', soft: '#1C3446', primaryText: '#8ED0F2',
      cardShadow: 'inset 0 1px 0 rgba(255,255,255,0.05), 0 4px 0 rgba(0,0,0,0.25)',
      buttonShadow: 'inset 0 1px 0 rgba(255,255,255,0.06), 0 3px 0 rgba(0,0,0,0.35)',
      navShadow: 'inset 0 1px 0 rgba(255,255,255,0.06), 0 10px 24px rgba(0,0,0,0.45)',
      tileLip: 'rgba(0,0,0,0.25)', up: '#8ED0F2', down: '#F0A060', watermarkOp: '0.12'
    } : {
      bg: '#EAF2F8', card: '#FFFFFF', card2: '#F2F7FB', ink: '#0F1C26', muted: '#5B6B78', line: '#E1EAF1',
      chipBg: '#0A74AA', lip: '#075A85', soft: '#DDEFF8', primaryText: '#08608E',
      cardShadow: '0 4px 0 #D3E1EB, 0 10px 24px rgba(15,28,38,0.06)',
      buttonShadow: '0 3px 0 #D3E1EB, 0 6px 14px rgba(15,28,38,0.06)',
      navShadow: '0 4px 0 #D3E1EB, 0 12px 28px rgba(15,28,38,0.12)',
      tileLip: '#DCE7EF', up: '#08608E', down: '#B4530B', watermarkOp: '0.07'
    };
    // move: 'up' — көтерілді, 'down' — түсті, 'same' — өзгеріс жоқ
    const moves = {
      up: { d: 'M5 1 L9.5 8.5 H0.5 Z', color: t.up, label: 'Жоғарылады' },
      down: { d: 'M0.5 1.5 H9.5 L5 9 Z', color: t.down, label: 'Төмендеді' },
      same: { d: 'M1 4.2 H9 V5.8 H1 Z', color: t.muted, label: 'Өзгеріс жоқ' }
    };
    const row = (rank, team, manager, gw, total, move, me) => ({
      rank: String(rank), team: team, manager: me ? 'Сен · ' + manager : manager,
      gw: String(gw), total: String(total),
      moveD: moves[move].d, moveColor: moves[move].color, moveLabel: moves[move].label,
      bg: me ? t.soft : 'transparent',
      ring: me ? 'inset 0 0 0 2px ' + t.chipBg : 'none',
      managerColor: me ? t.primaryText : t.muted
    });
    const rows = [
      row(1, 'Қызыл жолбарыстар', 'Ерлан Б.', 71, 768, 'up'),
      row(2, 'Дала барыстары', 'Айгерім С.', 58, 741, 'down'),
      row(3, 'Бүркіт XI', 'менің командам', 67, 712, 'up', true),
      row(4, 'Шымкент Юнайтед', 'Данияр К.', 44, 705, 'down'),
      row(5, 'Алтын доп', 'Әсел М.', 62, 699, 'up'),
      row(6, 'Тобыл жанкүйері', 'Бауыржан Т.', 39, 671, 'down'),
      row(7, 'Тұлпарлар', 'Мадина Ж.', 55, 664, 'same'),
      row(8, 'Арман FC', 'Арман О.', 48, 650, 'same')
    ];
    const tab = (label, icon, active) => ({
      label: label, icon: icon,
      current: active ? 'page' : 'false',
      color: active ? t.primaryText : t.muted,
      iconColor: active ? '#FFFFFF' : t.muted,
      pill: active ? t.chipBg : 'transparent',
      lip: active ? '0 2px 0 ' + t.lip : 'none'
    });
    const tabs = [
      tab('Команда', 'M8 3 L4 5 L2 9 L5 11 L6 10 V21 H18 V10 L19 11 L22 9 L20 5 L16 3 Q12 6 8 3 Z', false),
      tab('Трансфер', 'M4 7 H20 M16 3 L20 7 L16 11 M20 17 H4 M8 13 L4 17 L8 21', false),
      tab('Лигалар', 'M8 4 H16 V9 A4 4 0 0 1 8 9 Z M8 6 H5 A3 3 0 0 0 8 11 M16 6 H19 A3 3 0 0 1 16 11 M12 13 V17 M8 21 H16 M9.5 17 H14.5 V21 H9.5 Z', true),
      tab('Кесте', 'M4 6 H20 V20 H4 Z M4 10 H20 M8 3 V7 M16 3 V7', false)
    ];
    const shanyrakD = 'M3.5 9.3 Q12 13.6 20.5 9.3 M3.5 14.7 Q12 10.4 20.5 14.7 M9.3 3.5 Q13.6 12 9.3 20.5 M14.7 3.5 Q10.4 12 14.7 20.5';
    return { t: t, rows: rows, tabs: tabs, shanyrakD: shanyrakD };
  }
}
</script>
</body>
</html>
